<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* JOIN SCREEN */
        .join-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .logo p {
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
        }

        .input-group {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border 0.3s;
            font-family: 'Courier New', monospace;
            text-align: center;
            font-weight: bold;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.5s;
            font-weight: bold;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* WAITING SCREEN */
        .waiting-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .waiting-icon {
            font-size: 5em;
            margin-bottom: 30px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .waiting-text {
            color: white;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .player-name-display {
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* QUESTION SCREEN */
        .question-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .question-number {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            flex: 1;
        }

        .answer-btn {
            padding: 25px;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .answer-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .answer-btn:active {
            transform: scale(0.95);
        }

        .answer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .answer-btn.red { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .answer-btn.blue { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .answer-btn.yellow { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .answer-btn.green { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }

        .answer-btn.selected {
            animation: selectedPulse 0.5s;
            border: 5px solid white;
        }

        @keyframes selectedPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* RESULT SCREEN */
        .result-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .result-icon {
            font-size: 8em;
            margin-bottom: 20px;
            animation: zoomIn 0.5s;
        }

        @keyframes zoomIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .result-text {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result-text.correct { color: #2ecc71; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .result-text.incorrect { color: #e74c3c; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }

        .points-earned {
            font-size: 4em;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .leaderboard {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 400px;
            overflow-y: auto;
        }

        .leaderboard h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #f8f8f8;
        }

        .leaderboard-item.me {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            transform: scale(1.05);
        }

        .leaderboard-rank {
            font-weight: bold;
            margin-right: 10px;
        }

        /* FINAL SCREEN */
        .final-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .trophy {
            font-size: 10em;
            margin-bottom: 20px;
            animation: rotate 2s ease-in-out infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        .final-position {
            font-size: 4em;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .final-score {
            font-size: 3em;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- JOIN SCREEN -->
        <div id="joinScreen" class="join-screen">
            <div class="logo">
                <h1>🎮 Quiz Multiplayer</h1>
                <p>El Transport de Substàncies</p>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <div class="input-group">
                <label for="roomCode">Codi de la Sala</label>
                <input type="text" id="roomCode" placeholder="000000" maxlength="6" inputmode="numeric">
            </div>

            <div class="input-group">
                <label for="playerName">El Teu Nom</label>
                <input type="text" id="playerName" placeholder="Introdueix el teu nom" maxlength="20">
            </div>

            <button class="btn" id="joinBtn">Unir-se al Quiz</button>
        </div>

        <!-- WAITING SCREEN -->
        <div id="waitingScreen" class="waiting-screen hidden">
            <div class="waiting-icon">⏳</div>
            <div class="player-name-display" id="playerNameDisplay"></div>
            <div class="waiting-text">Esperant que comenci el quiz...</div>
        </div>

        <!-- QUESTION SCREEN -->
        <div id="questionScreen" class="question-screen hidden">
            <div class="question-header">
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="answers-grid" id="answersGrid"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="result-screen hidden">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-text" id="resultText"></div>
            <div class="points-earned" id="pointsEarned"></div>

            <div class="leaderboard">
                <h3>Classificació</h3>
                <div id="leaderboard"></div>
            </div>
        </div>

        <!-- FINAL SCREEN -->
        <div id="finalScreen" class="final-screen hidden">
            <div class="trophy" id="finalTrophy"></div>
            <div class="final-position" id="finalPosition"></div>
            <div class="final-score" id="finalScore"></div>

            <div class="leaderboard">
                <h3>Classificació Final</h3>
                <div id="finalLeaderboard"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let playerName = '';
        let hasAnswered = false;

        // Join room
        document.getElementById('joinBtn').addEventListener('click', joinRoom);
        document.getElementById('roomCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('playerName').focus();
        });
        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });

        function joinRoom() {
            const code = document.getElementById('roomCode').value.trim();
            const name = document.getElementById('playerName').value.trim();

            if (!code || code.length !== 6) {
                showError('El codi ha de tenir 6 dígits');
                return;
            }

            if (!name || name.length < 2) {
                showError('El nom ha de tenir almenys 2 caràcters');
                return;
            }

            playerName = name;

            socket.emit('join-room', { code, name }, (response) => {
                if (response.success) {
                    document.getElementById('joinScreen').classList.add('hidden');
                    document.getElementById('waitingScreen').classList.remove('hidden');
                    document.getElementById('playerNameDisplay').textContent = playerName;
                } else {
                    showError(response.message);
                }
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');

            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 3000);
        }

        // Game started
        socket.on('game-started', () => {
            document.getElementById('waitingScreen').classList.add('hidden');
        });

        // Receive question
        socket.on('question', (data) => {
            hasAnswered = false;
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');

            document.getElementById('questionNumber').textContent = `Pregunta ${data.questionNumber}/${data.totalQuestions}`;
            document.getElementById('questionText').textContent = data.question;

            const colors = ['red', 'blue', 'yellow', 'green'];
            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = data.answers.map((answer, index) => `
                <button class="answer-btn ${colors[index]}" onclick="selectAnswer(${index}, ${data.questionNumber})" id="answer${index}">
                    ${answer}
                </button>
            `).join('');
        });

        function selectAnswer(index, questionNumber) {
            if (hasAnswered) return;

            hasAnswered = true;
            document.getElementById(`answer${index}`).classList.add('selected');

            // Disable all buttons
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`answer${i}`);
                if (btn) btn.disabled = true;
            }

            // Get correct answer (stored in questions array)
            const questions = [
                2, 2, 2, 2, 1, 1, 2, 1, 1, 1, 2, 1, 1, 1, 1
            ];

            const correctAnswer = questions[questionNumber - 1];
            const timeLeft = parseInt(document.getElementById('timer')?.textContent || 10);

            socket.emit('submit-answer', {
                answerIndex: index,
                correctAnswer: correctAnswer,
                timeLeft: timeLeft
            }, (response) => {
                if (response.success) {
                    showResult(response.isCorrect, response.points);
                }
            });
        }

        function showResult(isCorrect, points) {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            const pointsEarned = document.getElementById('pointsEarned');

            if (isCorrect) {
                resultIcon.textContent = '✅';
                resultText.textContent = 'Correcte!';
                resultText.className = 'result-text correct';
                pointsEarned.textContent = `+${points} punts`;
            } else {
                resultIcon.textContent = '❌';
                resultText.textContent = 'Incorrecte';
                resultText.className = 'result-text incorrect';
                pointsEarned.textContent = '0 punts';
            }
        }

        // Show results/leaderboard
        socket.on('results', (data) => {
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = data.leaderboard.map((player, index) => `
                <div class="leaderboard-item ${player.name === playerName ? 'me' : ''}">
                    <span><span class="leaderboard-rank">${index + 1}.</span> ${player.name}</span>
                    <span>${player.score} pts</span>
                </div>
            `).join('');
        });

        // Game ended
        socket.on('game-ended', (data) => {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('finalScreen').classList.remove('hidden');

            const myPosition = data.leaderboard.findIndex(p => p.name === playerName) + 1;
            const myData = data.leaderboard.find(p => p.name === playerName);

            const trophy = document.getElementById('finalTrophy');
            if (myPosition === 1) trophy.textContent = '🏆';
            else if (myPosition === 2) trophy.textContent = '🥈';
            else if (myPosition === 3) trophy.textContent = '🥉';
            else trophy.textContent = '🎯';

            document.getElementById('finalPosition').textContent = `Posició #${myPosition}`;
            document.getElementById('finalScore').textContent = `${myData.score} punts`;

            const finalLeaderboard = document.getElementById('finalLeaderboard');
            finalLeaderboard.innerHTML = data.leaderboard.map((player, index) => `
                <div class="leaderboard-item ${player.name === playerName ? 'me' : ''}">
                    <span><span class="leaderboard-rank">${index + 1}.</span> ${player.name}</span>
                    <span>${player.score} pts</span>
                </div>
            `).join('');
        });

        // Host disconnected
        socket.on('host-disconnected', () => {
            alert('El host s\'ha desconnectat. La partida ha finalitzat.');
            location.reload();
        });
    </script>
</body>
</html>
