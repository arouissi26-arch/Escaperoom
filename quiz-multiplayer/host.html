<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Host - Transport de Substàncies</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* WAITING SCREEN */
        .waiting-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .room-code-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .room-code-section h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .room-code {
            font-size: 8em;
            font-weight: bold;
            letter-spacing: 20px;
            color: #764ba2;
            font-family: 'Courier New', monospace;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        }

        .join-url {
            margin-top: 20px;
            font-size: 1.5em;
            color: #666;
        }

        .players-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .players-header h2 {
            color: #667eea;
            font-size: 2.5em;
        }

        .player-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2em;
            font-weight: bold;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .player-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
        }

        .player-name {
            font-size: 1.5em;
            font-weight: bold;
        }

        .start-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 30px 60px;
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.4);
            transition: all 0.3s;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(46, 204, 113, 0.6);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* QUESTION SCREEN */
        .question-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .question-header {
            background: rgba(255,255,255,0.95);
            padding: 20px 40px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-number {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .timer {
            font-size: 4em;
            font-weight: bold;
            color: #764ba2;
            min-width: 100px;
            text-align: center;
        }

        .timer.warning {
            color: #e74c3c;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .answered-count {
            font-size: 1.5em;
            color: #666;
        }

        .question-content {
            flex: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .question-text {
            font-size: 3.5em;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 60px;
            line-height: 1.4;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
        }

        .answer-box {
            padding: 40px;
            border-radius: 20px;
            font-size: 2em;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .answer-box:hover {
            transform: scale(1.05);
        }

        .answer-box.red { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .answer-box.blue { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .answer-box.yellow { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .answer-box.green { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }

        .answer-box.correct {
            animation: correctPulse 1s ease-in-out infinite;
        }

        @keyframes correctPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            50% { box-shadow: 0 0 0 30px rgba(46, 204, 113, 0); }
        }

        /* RESULTS SCREEN */
        .results-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .results-header {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .results-header h2 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .leaderboard {
            flex: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            background: #f8f8f8;
            gap: 20px;
        }

        .leaderboard-item.rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            transform: scale(1.05);
        }

        .leaderboard-item.rank-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%);
            color: white;
        }

        .leaderboard-item.rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #B8860B 100%);
            color: white;
        }

        .rank {
            font-size: 3em;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        .player-info {
            flex: 1;
        }

        .player-name-leaderboard {
            font-size: 2em;
            font-weight: bold;
        }

        .score {
            font-size: 2.5em;
            font-weight: bold;
            min-width: 150px;
            text-align: right;
        }

        .action-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 30px 60px;
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            bottom: 120px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- WAITING SCREEN -->
        <div id="waitingScreen" class="waiting-screen">
            <div class="room-code-section">
                <h2>Codi de la Sala</h2>
                <div class="room-code" id="roomCode">------</div>
                <div class="join-url">Els jugadors es connecten a: <strong>http://[IP]:3000/quiz-multiplayer/player.html</strong></div>
            </div>

            <div class="players-section">
                <div class="players-header">
                    <h2>Jugadors Connectats</h2>
                    <div class="player-count"><span id="playerCount">0</span> jugadors</div>
                </div>
                <div class="players-grid" id="playersGrid"></div>
            </div>

            <button class="start-btn" id="startBtn" disabled>Iniciar Quiz</button>
        </div>

        <!-- QUESTION SCREEN -->
        <div id="questionScreen" class="question-screen hidden">
            <div class="question-header">
                <div class="question-number" id="questionNumber">Pregunta 1/15</div>
                <div class="answered-count" id="answeredCount">0/0 han respost</div>
                <div class="timer" id="timer">20</div>
            </div>

            <div class="question-content">
                <div class="question-text" id="questionText"></div>
                <div class="answers-grid" id="answersGrid"></div>
            </div>

            <button class="action-btn" id="nextBtn">Següent Pregunta</button>
            <button class="action-btn danger" id="endBtn">Finalitzar Quiz</button>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="resultsScreen" class="results-screen hidden">
            <div class="results-header">
                <h2>🏆 Classificació Final 🏆</h2>
            </div>

            <div class="leaderboard" id="finalLeaderboard"></div>

            <button class="action-btn" onclick="location.reload()">Nova Partida</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DEL SERVIDOR
        // Cambia esto si necesitas conectarte a un servidor específico
        // Por defecto intenta localhost:3000
        const SERVER_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : `http://${window.location.hostname}:3000`;

        console.log('🔌 Conectando al servidor:', SERVER_URL);

        const socket = io(SERVER_URL, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });

        // Evento de conexión exitosa
        socket.on('connect', () => {
            console.log('✅ Conectado al servidor!');
            document.body.style.borderTop = '5px solid #4CAF50';
        });

        // Evento de desconexión
        socket.on('disconnect', () => {
            console.log('❌ Desconectado del servidor');
            document.body.style.borderTop = '5px solid #f44336';
            alert('❌ Connexió perduda amb el servidor!\n\nAssegura\'t que:\n1. El servidor està funcionant (node server.js)\n2. L\'URL del servidor és correcta\n3. El port 3000 està obert');
        });

        // Error de conexión
        socket.on('connect_error', (error) => {
            console.error('❌ Error de connexió:', error);
            document.body.style.borderTop = '5px solid #f44336';
            alert(`❌ No es pot connectar al servidor!\n\nURL: ${SERVER_URL}\n\nInstruccions:\n1. Obre una terminal al directori quiz-multiplayer/\n2. Executa: node server.js\n3. Assegura\'t que el port 3000 està lliure\n4. Si el servidor està en un altre ordinador, canvia SERVER_URL a la línia 7 del codi`);
        });

        let roomCode = null;
        let currentQuestionIndex = -1;
        let timerInterval = null;
        let playerCount = 0;
        let answeredCount = 0;

        const questions = [
            { question: "Quin percentatge del pes corporal representa l'aigua?", answers: ["40%", "50%", "60%", "70%"], correct: 2 },
            { question: "Què és la difusió simple?", answers: ["Transport amb energia", "Moviment contra gradient", "Moviment a favor del gradient", "Transport de proteïnes"], correct: 2 },
            { question: "Quantes cambres té el cor humà?", answers: ["2", "3", "4", "5"], correct: 2 },
            { question: "Quina és la funció principal dels eritròcits?", answers: ["Defensa", "Coagulació", "Transport d'oxigen", "Producció d'anticossos"], correct: 2 },
            { question: "Què és la sístole?", answers: ["Relaxació del cor", "Contracció del cor", "Circulació pulmonar", "Batec irregular"], correct: 1 },
            { question: "Quin tipus de vas sanguini té parets més gruixudes?", answers: ["Venes", "Artèries", "Capil·lars", "Vènules"], correct: 1 },
            { question: "On es produeix l'intercanvi de gasos?", answers: ["Cor", "Artèries", "Capil·lars pulmonars", "Venes"], correct: 2 },
            { question: "Què transporta el sistema limfàtic?", answers: ["Només sang", "Linfa i greixos", "Només oxigen", "Només nutrients"], correct: 1 },
            { question: "Quants litres de sang té un adult?", answers: ["3-4 litres", "5-6 litres", "7-8 litres", "9-10 litres"], correct: 1 },
            { question: "Què és l'osmosi?", answers: ["Transport d'ions", "Difusió d'aigua", "Transport actiu", "Endocitosi"], correct: 1 },
            { question: "Quin component de la sang ajuda a coagular?", answers: ["Eritròcits", "Leucòcits", "Plaquetes", "Plasma"], correct: 2 },
            { question: "Quina circulació va del cor als pulmons?", answers: ["Sistèmica", "Pulmonar", "Coronària", "Portal"], correct: 1 },
            { question: "Què és el plasma sanguini?", answers: ["Cèl·lules vermelles", "Part líquida de la sang", "Plaquetes", "Anticossos"], correct: 1 },
            { question: "Quin és l'òrgan principal del sistema limfàtic?", answers: ["Cor", "Melsa", "Fetge", "Pulmó"], correct: 1 },
            { question: "Quantes pulsacions per minut té un adult en repòs?", answers: ["40-50", "60-80", "90-110", "120-140"], correct: 1 }
        ];

        // Create room
        socket.emit('create-room', (response) => {
            if (response.success) {
                roomCode = response.code;
                document.getElementById('roomCode').textContent = roomCode;
            }
        });

        // Players updated
        socket.on('players-updated', (data) => {
            updatePlayersList(data.players);
        });

        function updatePlayersList(players) {
            playerCount = players.length;
            document.getElementById('playerCount').textContent = playerCount;

            const grid = document.getElementById('playersGrid');
            grid.innerHTML = players.map((player, index) => `
                <div class="player-card">
                    <div class="player-avatar">${player.name.charAt(0).toUpperCase()}</div>
                    <div class="player-name">${player.name}</div>
                </div>
            `).join('');

            document.getElementById('startBtn').disabled = playerCount === 0;
        }

        // Start game
        document.getElementById('startBtn').addEventListener('click', () => {
            socket.emit('start-game');
            document.getElementById('waitingScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            nextQuestion();
        });

        // Next question
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            answeredCount = 0;
            const question = questions[currentQuestionIndex];

            document.getElementById('questionNumber').textContent = `Pregunta ${currentQuestionIndex + 1}/${questions.length}`;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('answeredCount').textContent = `${answeredCount}/${playerCount} han respost`;

            const colors = ['red', 'blue', 'yellow', 'green'];
            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = question.answers.map((answer, index) => `
                <div class="answer-box ${colors[index]} ${index === question.correct ? 'correct' : ''}" id="answer${index}">
                    ${answer}
                </div>
            `).join('');

            // Send question to players
            socket.emit('show-question', {
                questionNumber: currentQuestionIndex + 1,
                totalQuestions: questions.length,
                question: question.question,
                answers: question.answers
            });

            // Start timer
            startTimer();
        }

        function startTimer() {
            let timeLeft = 20;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = timeLeft;
            timerEl.classList.remove('warning');

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 5) {
                    timerEl.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        showResults();
                    }, 2000);
                }
            }, 1000);
        }

        // Player answered
        socket.on('player-answered', (data) => {
            answeredCount = data.answeredCount;
            document.getElementById('answeredCount').textContent = `${answeredCount}/${playerCount} han respost`;
        });

        function showResults() {
            const correctAnswer = questions[currentQuestionIndex].correct;
            socket.emit('show-results', correctAnswer);
        }

        // End game
        document.getElementById('endBtn').addEventListener('click', endGame);

        function endGame() {
            clearInterval(timerInterval);
            socket.emit('end-game');
        }

        socket.on('game-ended', (data) => {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');

            const leaderboard = document.getElementById('finalLeaderboard');
            leaderboard.innerHTML = data.leaderboard.map((player, index) => `
                <div class="leaderboard-item rank-${index + 1}">
                    <div class="rank">${index + 1}</div>
                    <div class="player-info">
                        <div class="player-name-leaderboard">${player.name}</div>
                        <div>${player.correctAnswers} respostes correctes</div>
                    </div>
                    <div class="score">${player.score} pts</div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
