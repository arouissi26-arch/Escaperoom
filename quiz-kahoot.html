<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizBio - El Transport de Substàncies</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Pantalla de benvinguda */
        .welcome-screen {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 40px;
        }

        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            font-size: 1.5rem;
            border: 3px solid #667eea;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        /* Pantalla de pregunta */
        .question-screen {
            text-align: center;
        }

        .question-header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-number {
            font-size: 1.2rem;
            color: #764ba2;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .question-text {
            font-size: 2rem;
            color: #333;
            font-weight: 900;
            line-height: 1.4;
        }

        .timer {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .answer-btn {
            padding: 40px 20px;
            border: none;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .answer-btn:hover:not(.disabled) {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .answer-btn.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            animation: correctAnim 0.5s ease;
        }

        .answer-btn.incorrect {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            animation: shake 0.5s ease;
        }

        @keyframes correctAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .answer-btn:nth-child(1) { background: linear-gradient(135deg, #e21b3c 0%, #d31027 100%); }
        .answer-btn:nth-child(2) { background: linear-gradient(135deg, #1368ce 0%, #0948a8 100%); }
        .answer-btn:nth-child(3) { background: linear-gradient(135deg, #ffa602 0%, #e69500 100%); }
        .answer-btn:nth-child(4) { background: linear-gradient(135deg, #26890d 0%, #1e6b0a 100%); }

        .answer-icon {
            font-size: 2rem;
            margin-right: 15px;
        }

        /* Pantalla de ranking */
        .ranking-screen {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .ranking-title {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 900;
        }

        .ranking-subtitle {
            font-size: 1.2rem;
            color: #666;
            text-align: center;
            margin-bottom: 40px;
        }

        .podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 40px;
            gap: 20px;
        }

        .podium-item {
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .podium-item:nth-child(1) { animation-delay: 0.4s; }
        .podium-item:nth-child(2) { animation-delay: 0.2s; }
        .podium-item:nth-child(3) { animation-delay: 0.6s; }

        .podium-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 10px;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .podium-place-1 .podium-avatar {
            width: 120px;
            height: 120px;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .podium-platform {
            background: #f0f0f0;
            border-radius: 10px 10px 0 0;
            padding: 20px;
            position: relative;
        }

        .podium-place-1 .podium-platform {
            height: 150px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .podium-place-2 .podium-platform {
            height: 120px;
            background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%);
        }

        .podium-place-3 .podium-platform {
            height: 90px;
            background: linear-gradient(135deg, #CD7F32 0%, #B87333 100%);
        }

        .podium-position {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 10px;
        }

        .podium-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .podium-score {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
        }

        .ranking-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            background: #e9e9e9;
            transform: translateX(10px);
        }

        .ranking-position {
            font-size: 1.5rem;
            font-weight: 900;
            color: #667eea;
            width: 40px;
        }

        .ranking-name {
            flex: 1;
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .ranking-score {
            font-size: 1.3rem;
            font-weight: 900;
            color: #764ba2;
        }

        .restart-btn {
            margin-top: 30px;
            width: 100%;
        }

        /* Efecte de confeti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        .current-player {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .current-player-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 5px;
        }

        .current-player-name {
            font-size: 1.5rem;
            font-weight: 900;
            color: #667eea;
        }

        .current-player-score {
            font-size: 1.2rem;
            font-weight: 700;
            color: #764ba2;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pantalla de benvinguda -->
        <div class="screen active" id="welcomeScreen">
            <div class="welcome-screen">
                <div class="logo">🧬</div>
                <h1>QuizBio</h1>
                <p class="subtitle">El Transport de Substàncies al Cos Humà</p>
                <input type="text" id="playerName" placeholder="El teu nom..." maxlength="20">
                <br>
                <button class="btn" onclick="startQuiz()">Començar!</button>
                <p style="margin-top: 20px; color: #999; font-size: 0.9rem;">15 preguntes · 20 segons per pregunta</p>
            </div>
        </div>

        <!-- Pantalla de pregunta -->
        <div class="screen" id="questionScreen">
            <div class="current-player">
                <div class="current-player-label">Jugador:</div>
                <div class="current-player-name" id="currentPlayerName"></div>
                <div class="current-player-score" id="currentPlayerScore">0 punts</div>
            </div>

            <div class="question-header">
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="timer" id="timer">20</div>

            <div class="answers-grid" id="answersGrid">
                <!-- Les respostes es generaran dinàmicament -->
            </div>
        </div>

        <!-- Pantalla de ranking -->
        <div class="screen" id="rankingScreen">
            <div class="ranking-screen">
                <div class="ranking-title">🏆 Classificació Final 🏆</div>
                <div class="ranking-subtitle">Resultats del quiz</div>

                <div class="podium" id="podium">
                    <!-- El podi es generarà dinàmicament -->
                </div>

                <div class="ranking-list" id="rankingList">
                    <!-- La llista es generarà dinàmicament -->
                </div>

                <button class="btn restart-btn" onclick="restartQuiz()">Jugar de nou</button>
                <button class="btn restart-btn" onclick="clearRanking()" style="background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%); margin-top: 10px;">Esborrar ranking</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Quin percentatge del pes corporal representa l'aigua?",
                answers: ["40%", "50%", "60%", "70%"],
                correct: 2
            },
            {
                question: "Quants ions de sodi (Na⁺) expulsa la bomba Na⁺/K⁺?",
                answers: ["2", "3", "4", "5"],
                correct: 1
            },
            {
                question: "Quants litres de sang bombeja el cor cada dia?",
                answers: ["3.000 L", "5.000 L", "7.000 L", "10.000 L"],
                correct: 2
            },
            {
                question: "Quantes vegades batega el cor al dia?",
                answers: ["50.000", "75.000", "100.000", "125.000"],
                correct: 2
            },
            {
                question: "Quin tipus de transport NO gasta energia?",
                answers: ["Transport actiu", "Bomba Na⁺/K⁺", "Difusió simple", "Tots gasten energia"],
                correct: 2
            },
            {
                question: "Quantes cambres té el cor?",
                answers: ["2", "3", "4", "5"],
                correct: 2
            },
            {
                question: "Quant temps viu un glòbul vermell?",
                answers: ["30 dies", "60 dies", "90 dies", "120 dies"],
                correct: 3
            },
            {
                question: "Quants glòbuls vermells produeix el cos per SEGON?",
                answers: ["1 milió", "2,4 milions", "5 milions", "10 milions"],
                correct: 1
            },
            {
                question: "El sistema limfàtic TÉ cor?",
                answers: ["Sí, té un cor petit", "No, no en té", "Té dos cors", "Només en algunes persones"],
                correct: 1
            },
            {
                question: "Quin percentatge de la sang és plasma?",
                answers: ["35%", "45%", "55%", "65%"],
                correct: 2
            },
            {
                question: "Les artèries transporten sang...",
                answers: ["Desoxigenada", "Oxigenada", "Sense oxigen", "Només CO₂"],
                correct: 1
            },
            {
                question: "Quina proteïna transporten els glòbuls vermells?",
                answers: ["Albúmina", "Fibrinogen", "Hemoglobina", "Glucosa"],
                correct: 2
            },
            {
                question: "En quant de temps fa la sang un circuit complet en repòs?",
                answers: ["20 segons", "40 segons", "1 minut", "2 minuts"],
                correct: 2
            },
            {
                question: "Quants quilòmetres de vasos sanguinis tenim?",
                answers: ["50.000 km", "75.000 km", "97.000 km", "150.000 km"],
                correct: 2
            },
            {
                question: "Quin % d'energia gasten les neurones en la bomba Na⁺/K⁺?",
                answers: ["30%", "50%", "70%", "90%"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let playerName = "";
        let timeLeft = 20;
        let timerInterval = null;
        let answered = false;

        const icons = ["🔺", "🔷", "🟠", "🟩"];

        function startQuiz() {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                alert('Si us plau, introdueix el teu nom!');
                return;
            }

            document.getElementById('currentPlayerName').textContent = playerName;
            showScreen('questionScreen');
            currentQuestion = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endQuiz();
                return;
            }

            answered = false;
            timeLeft = 20;
            const q = questions[currentQuestion];

            document.getElementById('questionNumber').textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('timer').textContent = timeLeft;

            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = '';

            q.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerHTML = `<span class="answer-icon">${icons[index]}</span>${answer}`;
                btn.onclick = () => selectAnswer(index);
                answersGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!answered) {
                        showCorrectAnswer();
                        setTimeout(() => {
                            currentQuestion++;
                            loadQuestion();
                        }, 2000);
                    }
                }
            }, 1000);
        }

        function selectAnswer(index) {
            if (answered) return;
            answered = true;

            clearInterval(timerInterval);

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');

            buttons.forEach(btn => btn.classList.add('disabled'));

            if (index === q.correct) {
                buttons[index].classList.add('correct');
                const points = Math.round(100 + (timeLeft * 10));
                score += points;
                document.getElementById('currentPlayerScore').textContent = `${score} punts`;
            } else {
                buttons[index].classList.add('incorrect');
                buttons[q.correct].classList.add('correct');
            }

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 2000);
        }

        function showCorrectAnswer() {
            answered = true;
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.classList.add('disabled'));
            buttons[q.correct].classList.add('correct');
        }

        function endQuiz() {
            saveScore();
            showRanking();
        }

        function saveScore() {
            let ranking = JSON.parse(localStorage.getItem('quizRanking') || '[]');
            ranking.push({
                name: playerName,
                score: score,
                date: new Date().toISOString()
            });
            ranking.sort((a, b) => b.score - a.score);
            localStorage.setItem('quizRanking', JSON.stringify(ranking));
        }

        function showRanking() {
            showScreen('rankingScreen');

            const ranking = JSON.parse(localStorage.getItem('quizRanking') || '[]');
            const podium = document.getElementById('podium');
            const rankingList = document.getElementById('rankingList');

            podium.innerHTML = '';
            rankingList.innerHTML = '';

            // Podi (top 3)
            const top3 = ranking.slice(0, 3);
            const podiumOrder = [1, 0, 2]; // 2n, 1r, 3r (per l'efecte visual)

            podiumOrder.forEach((idx) => {
                if (top3[idx]) {
                    const player = top3[idx];
                    const position = idx + 1;
                    const medals = ['🥇', '🥈', '🥉'];

                    const podiumItem = document.createElement('div');
                    podiumItem.className = `podium-item podium-place-${position}`;
                    podiumItem.innerHTML = `
                        <div class="podium-avatar">${medals[idx]}</div>
                        <div class="podium-platform">
                            <div class="podium-position">#${position}</div>
                            <div class="podium-name">${player.name}</div>
                            <div class="podium-score">${player.score} pts</div>
                        </div>
                    `;
                    podium.appendChild(podiumItem);
                }
            });

            // Resta del ranking (a partir del 4t)
            ranking.slice(3).forEach((player, index) => {
                const item = document.createElement('div');
                item.className = 'ranking-item';
                item.innerHTML = `
                    <div class="ranking-position">#${index + 4}</div>
                    <div class="ranking-name">${player.name}</div>
                    <div class="ranking-score">${player.score} pts</div>
                `;
                rankingList.appendChild(item);
            });

            // Confeti si ets el primer
            if (ranking[0] && ranking[0].name === playerName && ranking[0].score === score) {
                createConfetti();
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = Math.random() + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('playerName').value = '';
            showScreen('welcomeScreen');
        }

        function clearRanking() {
            if (confirm('Estàs segur que vols esborrar tot el ranking?')) {
                localStorage.removeItem('quizRanking');
                showRanking();
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Enter per començar
        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startQuiz();
            }
        });
    </script>
</body>
</html>
