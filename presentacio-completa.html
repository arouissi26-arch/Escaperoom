<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Transport de Substàncies al Cos Humà</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background: #0a0a0a;
            height: 100vh;
            cursor: pointer;
        }

        /* Contenidor */
        .presentation-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Diapositiva */
        .slide {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            opacity: 0;
        }

        .slide.active {
            display: block;
            animation: slideEnter 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes slideEnter {
            from {
                opacity: 0;
                transform: scale(0.8) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        .slide.exit {
            animation: slideExit 0.6s ease forwards;
        }

        @keyframes slideExit {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.8) translateX(-200px);
            }
        }

        /* Fons amb gradient animat */
        .slide-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .bg-red-blue {
            background: linear-gradient(135deg, #8B0000 0%, #1e1e3f 100%);
        }

        .bg-blue-red {
            background: linear-gradient(135deg, #1e1e3f 0%, #8B0000 100%);
        }

        .bg-dark-red {
            background: linear-gradient(135deg, #0a0a0a 0%, #4a0000 50%, #0a0a0a 100%);
        }

        .bg-dark-blue {
            background: linear-gradient(135deg, #0a0a0a 0%, #000d4a 50%, #0a0a0a 100%);
        }

        .bg-split {
            background: linear-gradient(90deg, #8B0000 0%, #8B0000 50%, #1e3a8a 50%, #1e3a8a 100%);
        }

        /* Contingut */
        .slide-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
        }

        /* Títols */
        .slide-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: titleReveal 1s ease forwards;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slide-subtitle {
            font-size: 2rem;
            font-weight: 300;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 60px;
            animation: subtitleReveal 1s ease 0.3s forwards;
            opacity: 0;
        }

        @keyframes subtitleReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Text gran */
        .big-text {
            font-size: 5rem;
            font-weight: 900;
            color: #DC143C;
            text-align: center;
            line-height: 1.2;
            animation: bigTextPulse 2s ease infinite;
        }

        @keyframes bigTextPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Llista de punts elegant */
        .elegant-list {
            list-style: none;
            padding: 0;
            max-width: 900px;
            margin: 0 auto;
        }

        .elegant-list li {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 30px;
            padding-left: 60px;
            position: relative;
            opacity: 0;
            animation: listItemAppear 0.6s ease forwards;
        }

        .elegant-list li:nth-child(1) { animation-delay: 0.4s; }
        .elegant-list li:nth-child(2) { animation-delay: 0.6s; }
        .elegant-list li:nth-child(3) { animation-delay: 0.8s; }
        .elegant-list li:nth-child(4) { animation-delay: 1s; }
        .elegant-list li:nth-child(5) { animation-delay: 1.2s; }

        @keyframes listItemAppear {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .elegant-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, #DC143C 0%, #1e3a8a 100%);
        }

        /* Layout dos columnes */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            width: 100%;
            max-width: 1400px;
        }

        .column {
            animation: columnSlide 0.8s ease forwards;
            opacity: 0;
        }

        .column:nth-child(1) {
            animation-delay: 0.4s;
        }

        .column:nth-child(2) {
            animation-delay: 0.6s;
        }

        @keyframes columnSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .column h3 {
            font-size: 2.5rem;
            color: #DC143C;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .column p {
            font-size: 1.3rem;
            color: #d0d0d0;
            line-height: 1.8;
        }

        /* Números grans */
        .big-number {
            font-size: 12rem;
            font-weight: 900;
            color: rgba(220, 20, 60, 0.3);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: numberRotate 20s linear infinite;
        }

        @keyframes numberRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Caixa de destacat */
        .highlight-box {
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.2) 0%, rgba(30, 58, 138, 0.2) 100%);
            border: 2px solid #DC143C;
            padding: 40px;
            border-radius: 20px;
            margin: 40px 0;
            animation: boxGlow 2s ease infinite;
        }

        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
            50% { box-shadow: 0 0 40px rgba(220, 20, 60, 0.6); }
        }

        .highlight-box h4 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .highlight-box p {
            font-size: 1.4rem;
            color: #e0e0e0;
            line-height: 1.7;
        }

        /* Imatges */
        .slide-image {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(220, 20, 60, 0.4);
            animation: imageZoomIn 1.2s ease-out;
            object-fit: contain;
        }

        .slide-image.centered {
            display: block;
            margin: 40px auto;
            max-height: 700px;
        }

        .slide-image.float-right {
            float: right;
            max-width: 45%;
            margin-left: 40px;
            margin-bottom: 20px;
        }

        .slide-image.float-left {
            float: left;
            max-width: 45%;
            margin-right: 40px;
            margin-bottom: 20px;
        }

        @keyframes imageZoomIn {
            from {
                opacity: 0;
                transform: scale(0.85) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .two-columns.image-text {
            align-items: center;
        }

        /* Grid de dades */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 60px;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            animation: dataItemFade 0.8s ease forwards;
            opacity: 0;
        }

        .data-item:nth-child(1) { animation-delay: 0.5s; }
        .data-item:nth-child(2) { animation-delay: 0.7s; }
        .data-item:nth-child(3) { animation-delay: 0.9s; }
        .data-item:nth-child(4) { animation-delay: 1.1s; }
        .data-item:nth-child(5) { animation-delay: 1.3s; }
        .data-item:nth-child(6) { animation-delay: 1.5s; }

        @keyframes dataItemFade {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .data-item:hover {
            border-color: #DC143C;
            background: rgba(220, 20, 60, 0.1);
            transform: translateY(-10px);
        }

        .data-item h5 {
            font-size: 3rem;
            color: #DC143C;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .data-item p {
            font-size: 1.2rem;
            color: #d0d0d0;
        }

        /* Pantalla de benvinguda */
        .welcome-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B0000 0%, #0a0a0a 50%, #1e3a8a 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .welcome-title {
            font-size: 5rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 40px;
            animation: welcomeTitle 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        @keyframes welcomeTitle {
            from {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .welcome-subtitle {
            font-size: 1.8rem;
            color: #e0e0e0;
            margin-bottom: 60px;
            animation: welcomeSubtitle 1s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes welcomeSubtitle {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .authors {
            font-size: 1.3rem;
            color: #d0d0d0;
            margin-bottom: 80px;
            animation: authorsAppear 1s ease 1s forwards;
            opacity: 0;
        }

        .click-instruction {
            font-size: 1.5rem;
            color: #DC143C;
            animation: clickPulse 1.5s ease infinite;
        }

        @keyframes clickPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes authorsAppear {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Indicador de diapositiva */
        .slide-indicator {
            position: fixed;
            bottom: 40px;
            right: 40px;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            z-index: 1000;
        }

        /* Formes decoratives */
        .shape-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: shapeFloat 10s ease-in-out infinite;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #DC143C;
            top: 10%;
            left: 10%;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: #1e3a8a;
            bottom: 15%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes shapeFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .slide-title { font-size: 3.5rem; }
            .elegant-list li { font-size: 1.5rem; }
            .two-columns { grid-template-columns: 1fr; gap: 40px; }
            .data-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .slide-content { padding: 40px; }
            .slide-title { font-size: 2.5rem; letter-spacing: 3px; }
            .elegant-list li { font-size: 1.2rem; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

// Variables globals
let currentSlide = 0;
let isWelcomeScreen = true;

// Inicialització
document.addEventListener('DOMContentLoaded', () => {
    showWelcomeScreen();
    setupEventListeners();
});

// Pantalla de benvinguda
function showWelcomeScreen() {
    const container = document.querySelector('.presentation-container');
    container.innerHTML = `
        <div class="welcome-screen">
            <h1 class="welcome-title">El Transport de Substàncies al Cos Humà</h1>
            <p class="welcome-subtitle">Presentació Educativa Interactiva</p>
            <div class="authors">
                Aissa Rousi • Ivan Rios • Roger Omegna<br>
                Unai Jimenez • Yeremi Suarez
            </div>
            <p class="click-instruction">Fes clic per començar</p>
        </div>
    `;
}

// Inicia la presentació
function startPresentation() {
    isWelcomeScreen = false;
    currentSlide = 0;

    const container = document.querySelector('.presentation-container');
    container.innerHTML = '';

    // Crear totes les diapositives
    slidesData.forEach((slideData, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.id = `slide-${index}`;
        slide.innerHTML = slideData.content;
        container.appendChild(slide);
    });

    // Afegir indicador
    const indicator = document.createElement('div');
    indicator.className = 'slide-indicator';
    indicator.id = 'slide-indicator';
    container.appendChild(indicator);

    // Mostrar primera diapositiva
    showSlide(0);
}

// Mostra una diapositiva
function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    const indicator = document.getElementById('slide-indicator');

    slides.forEach(slide => {
        slide.classList.remove('active');
        slide.classList.remove('exit');
    });

    setTimeout(() => {
        slides[index].classList.add('active');
        if (indicator) {
            indicator.textContent = `${index + 1} / ${slidesData.length}`;
        }
    }, 100);
}

// Següent diapositiva
function nextSlide() {
    if (currentSlide < slidesData.length - 1) {
        const currentSlideEl = document.getElementById(`slide-${currentSlide}`);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            currentSlide++;
            showSlide(currentSlide);
        }, 600);
    } else {
        // Tornar al principi
        const currentSlideEl = document.getElementById(`slide-${currentSlide}`);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            restartPresentation();
        }, 600);
    }
}

// Diapositiva anterior
function previousSlide() {
    if (currentSlide > 0) {
        const currentSlideEl = document.getElementById(`slide-${currentSlide}`);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            currentSlide--;
            showSlide(currentSlide);
        }, 600);
    }
}

// Event listeners
function setupEventListeners() {
    // Click per avançar
    document.addEventListener('click', () => {
        if (isWelcomeScreen) {
            startPresentation();
        } else {
            nextSlide();
        }
    });

    // Navegació amb teclat
    document.addEventListener('keydown', (e) => {
        if (isWelcomeScreen) {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                startPresentation();
            }
            return;
        }

        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            previousSlide();
        } else if (e.key === 'Home') {
            e.preventDefault();
            currentSlide = 0;
            showSlide(0);
        } else if (e.key === 'End') {
            e.preventDefault();
            currentSlide = slidesData.length - 1;
            showSlide(currentSlide);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            restartPresentation();
        }
    });
}

// Reiniciar presentació
function restartPresentation() {
    isWelcomeScreen = true;
    currentSlide = 0;
    document.querySelectorAll('.slide').forEach(el => el.remove());
    document.getElementById('slide-indicator')?.remove();
    showWelcomeScreen();
}
