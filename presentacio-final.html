<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Transport de Substàncies al Cos Humà</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --parallax-x: 0;
            --parallax-y: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, rgba(220, 20, 60, 0.1), transparent 30%), #0a0a0a;
            height: 100vh;
            cursor: pointer;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .slide {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            opacity: 0;
            overflow: hidden;
        }

        .slide.active {
            display: block;
        }

        /* Transicions variades - s'aplicaran de forma alterna */
        .slide.active.transition-fade {
            animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .slide.active.transition-slide-left {
            animation: slideFromLeft 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .slide.active.transition-slide-right {
            animation: slideFromRight 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .slide.active.transition-slide-up {
            animation: slideFromBottom 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .slide.active.transition-zoom {
            animation: zoomIn 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .slide.active.transition-rotate {
            animation: rotateIn 1.1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .slide.active.transition-flip {
            animation: flipIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .slide.active.transition-expand {
            animation: expandIn 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .slide.active.transition-blur {
            animation: blurIn 1s ease forwards;
        }

        .slide.active.transition-bounce {
            animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        /* Animacions d'entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideFromLeft {
            from {
                opacity: 0;
                transform: translateX(-100%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromRight {
            from {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromBottom {
            from {
                opacity: 0;
                transform: translateY(100%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-180deg) scale(0.5);
            }
            to {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes flipIn {
            from {
                opacity: 0;
                transform: perspective(1000px) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: perspective(1000px) rotateY(0deg);
            }
        }

        @keyframes expandIn {
            from {
                opacity: 0;
                transform: scale(0.1) rotate(45deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes blurIn {
            from {
                opacity: 0;
                filter: blur(20px);
            }
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-100px);
            }
            50% {
                transform: scale(1.05) translateY(10px);
            }
            70% {
                transform: scale(0.95) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .slide.exit {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .slide-bg {
            position: absolute;
            width: 110%;
            height: 110%;
            z-index: 0;
            top: -5%;
            left: -5%;
            transform: translate(calc(var(--parallax-x) * 12px), calc(var(--parallax-y) * 12px));
            transition: transform 0.2s ease;
        }

        /* Gradients variats */
        .bg-red-blue {
            background: linear-gradient(135deg, #8B0000 0%, #1e1e3f 100%);
        }

        .bg-blue-red {
            background: linear-gradient(135deg, #1e1e3f 0%, #8B0000 100%);
        }

        .bg-green-dark {
            background: linear-gradient(135deg, #0a4d2e 0%, #0a0a0a 100%);
        }

        .bg-purple-dark {
            background: linear-gradient(135deg, #4a0080 0%, #1a0033 100%);
        }

        .bg-orange-dark {
            background: linear-gradient(135deg, #cc4400 0%, #0a0a0a 100%);
        }

        .bg-cyan-dark {
            background: linear-gradient(135deg, #006b7d 0%, #0a0a0a 100%);
        }

        .bg-yellow-dark {
            background: linear-gradient(135deg, #b8860b 0%, #0a0a0a 100%);
        }

        .bg-teal-dark {
            background: linear-gradient(135deg, #00695c 0%, #0a0a0a 100%);
        }

        .bg-magenta-dark {
            background: linear-gradient(135deg, #880e4f 0%, #0a0a0a 100%);
        }

        .bg-indigo-dark {
            background: linear-gradient(135deg, #1a237e 0%, #0a0a0a 100%);
        }

        .bg-split-rg {
            background: linear-gradient(90deg, #8B0000 0%, #8B0000 50%, #0a4d2e 50%, #0a4d2e 100%);
        }

        .bg-split-bp {
            background: linear-gradient(90deg, #1e1e3f 0%, #1e1e3f 50%, #4a0080 50%, #4a0080 100%);
        }

        /* Nous gradients més creatius */
        .bg-radial-burst {
            background: radial-gradient(circle at 30% 40%, #DC143C 0%, #1e1e3f 50%, #0a0a0a 100%);
        }

        .bg-diagonal-wave {
            background: linear-gradient(45deg, #8B0000 0%, #4a0080 33%, #006b7d 66%, #0a4d2e 100%);
        }

        .bg-mesh {
            background:
                radial-gradient(at 20% 30%, rgba(220, 20, 60, 0.3) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(30, 30, 63, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(138, 43, 226, 0.2) 0px, transparent 50%),
                #0a0a0a;
        }

        .bg-aurora {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: aurora 18s ease infinite;
        }

        @keyframes aurora {
            0%{background-position:0% 82%}
            50%{background-position:100% 19%}
            100%{background-position:0% 82%}
        }

        /* Efecte glassmorphism per fons moderns */
        .bg-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            gap: 10px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        /* Layouts creatius variats */
        .layout-circular {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            max-width: 1200px;
        }

        .layout-circular .circle-item {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 4px solid #DC143C;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            animation: floatCircle 3s ease-in-out infinite;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .layout-circular .circle-item:nth-child(1) { animation-delay: 0s; }
        .layout-circular .circle-item:nth-child(2) { animation-delay: 0.5s; }
        .layout-circular .circle-item:nth-child(3) { animation-delay: 1s; }
        .layout-circular .circle-item:nth-child(4) { animation-delay: 1.5s; }

        @keyframes floatCircle {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .layout-circular .circle-item:hover {
            transform: scale(1.15) !important;
            border-color: #FFD700;
            box-shadow: 0 0 50px rgba(220, 20, 60, 0.6);
        }

        /* Layout zigzag asimètric */
        .layout-zigzag {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 1400px;
        }

        .layout-zigzag .zigzag-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .layout-zigzag .zigzag-row:nth-child(even) {
            direction: rtl;
        }

        .layout-zigzag .zigzag-row:nth-child(even) > * {
            direction: ltr;
        }

        .layout-zigzag .zigzag-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 50px;
            border-radius: 25px;
            border-left: 6px solid #DC143C;
            animation: slideZigzag 0.8s ease forwards;
            opacity: 0;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
            min-height: 220px;
        }

        @keyframes slideZigzag {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Layout de cards flotantes amb efecte 3D */
        .layout-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 50px;
            width: 100%;
            max-width: 1400px;
            perspective: 1000px;
        }

        .floating-card {
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.15) 0%, rgba(30, 58, 138, 0.15) 100%);
            border: 3px solid rgba(220, 20, 60, 0.4);
            border-radius: 30px;
            padding: 50px;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            animation: cardFloat 4s ease-in-out infinite;
            min-height: 300px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .floating-card:nth-child(1) { animation-delay: 0s; }
        .floating-card:nth-child(2) { animation-delay: 0.7s; }
        .floating-card:nth-child(3) { animation-delay: 1.4s; }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0) rotateX(0deg) rotateY(0deg);
            }
            25% {
                transform: translateY(-15px) rotateX(5deg) rotateY(-3deg);
            }
            50% {
                transform: translateY(0) rotateX(0deg) rotateY(5deg);
            }
            75% {
                transform: translateY(-10px) rotateX(-3deg) rotateY(-5deg);
            }
        }

        .floating-card:hover {
            transform: translateY(-30px) rotateX(10deg) scale(1.05) !important;
            box-shadow: 0 30px 80px rgba(220, 20, 60, 0.4);
            border-color: #DC143C;
        }

        /* Layout asimètric modern */
        .layout-asymmetric {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            height: 70vh;
        }

        .layout-asymmetric .asymmetric-main {
            grid-row: 1 / 3;
            background: rgba(220, 20, 60, 0.15);
            border-radius: 35px;
            padding: 60px;
            border: 4px solid #DC143C;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(220, 20, 60, 0.3);
            }
            50% {
                box-shadow: 0 0 50px rgba(220, 20, 60, 0.7);
            }
        }

        .layout-asymmetric .asymmetric-side {
            background: rgba(30, 58, 138, 0.15);
            border-radius: 25px;
            padding: 40px;
            border: 3px solid rgba(30, 58, 138, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        /* Layout amb formes geomètriques */
        .layout-geometric {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 70vh;
        }

        .geometric-shape {
            position: absolute;
            background: rgba(220, 20, 60, 0.1);
            border: 3px solid #DC143C;
            padding: 30px;
            animation: shapeRotate 20s linear infinite;
        }

        @keyframes shapeRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .geometric-shape.hexagon {
            width: 300px;
            height: 260px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            top: 10%;
            left: 10%;
        }

        .geometric-shape.diamond {
            width: 250px;
            height: 250px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            top: 40%;
            right: 15%;
        }

        .slide-title {
            font-size: clamp(2.2rem, 3vw + 1rem, 4rem);
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: titleReveal 1s ease forwards;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            line-height: 1.1;
            text-wrap: balance;
            word-break: break-word;
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slide-subtitle {
            font-size: clamp(1.1rem, 1vw + 1rem, 1.8rem);
            font-weight: 300;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 35px;
            animation: subtitleReveal 1s ease 0.3s forwards;
            opacity: 0;
            text-wrap: balance;
        }

        @keyframes subtitleReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .elegant-list {
            list-style: none;
            padding: 0;
            max-width: 1100px;
            margin: 0 auto;
        }

        .elegant-list li {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            padding-left: 50px;
            position: relative;
            opacity: 0;
            animation: listItemAppear 0.6s ease forwards;
        }

        .elegant-list li:nth-child(1) { animation-delay: 0.4s; }
        .elegant-list li:nth-child(2) { animation-delay: 0.6s; }
        .elegant-list li:nth-child(3) { animation-delay: 0.8s; }
        .elegant-list li:nth-child(4) { animation-delay: 1s; }
        .elegant-list li:nth-child(5) { animation-delay: 1.2s; }
        .elegant-list li:nth-child(6) { animation-delay: 1.4s; }

        @keyframes listItemAppear {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .elegant-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 4px;
            background: linear-gradient(90deg, #DC143C 0%, #1e3a8a 100%);
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            width: 100%;
            max-width: 1400px;
        }

        .column {
            animation: columnSlide 0.8s ease forwards;
            opacity: 0;
        }

        .column:nth-child(1) {
            animation-delay: 0.4s;
        }

        .column:nth-child(2) {
            animation-delay: 0.6s;
        }

        @keyframes columnSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .column h3 {
            font-size: 2rem;
            color: #DC143C;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .column p {
            font-size: 1.2rem;
            color: #d0d0d0;
            line-height: 1.7;
        }

        .highlight-box {
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.2) 0%, rgba(30, 58, 138, 0.2) 100%);
            border: 2px solid #DC143C;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            animation: boxGlow 2s ease infinite;
        }

        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
            50% { box-shadow: 0 0 40px rgba(220, 20, 60, 0.6); }
        }

        .highlight-box h4 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .highlight-box p {
            font-size: 1.2rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .slide-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(220, 20, 60, 0.4);
            animation: imageZoomIn 1.2s ease-out;
            object-fit: contain;
        }

        .slide-image.centered {
            display: block;
            margin: 30px auto;
            max-height: 600px;
        }

        @keyframes imageZoomIn {
            from {
                opacity: 0;
                transform: scale(0.85) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .two-columns.image-text {
            align-items: center;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid transparent;
            transition: all 0.4s ease;
            animation: dataItemFade 0.8s ease forwards;
            opacity: 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .data-item:nth-child(1) { animation-delay: 0.5s; }
        .data-item:nth-child(2) { animation-delay: 0.7s; }
        .data-item:nth-child(3) { animation-delay: 0.9s; }
        .data-item:nth-child(4) { animation-delay: 1.1s; }
        .data-item:nth-child(5) { animation-delay: 1.3s; }
        .data-item:nth-child(6) { animation-delay: 1.5s; }

        @keyframes dataItemFade {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .data-item:hover {
            border-color: #DC143C;
            background: rgba(220, 20, 60, 0.1);
            transform: translateY(-10px);
        }

        .data-item h5 {
            font-size: 2.5rem;
            color: #DC143C;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .data-item p {
            font-size: 1.1rem;
            color: #d0d0d0;
        }

        .welcome-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B0000 0%, #0a0a0a 50%, #1e3a8a 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .welcome-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            animation: welcomeTitle 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-transform: uppercase;
            letter-spacing: 6px;
        }

        @keyframes welcomeTitle {
            from {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .welcome-subtitle {
            font-size: 1.6rem;
            color: #e0e0e0;
            margin-bottom: 50px;
            animation: welcomeSubtitle 1s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes welcomeSubtitle {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .authors {
            font-size: 1.2rem;
            color: #d0d0d0;
            margin-bottom: 60px;
            animation: authorsAppear 1s ease 1s forwards;
            opacity: 0;
            text-align: center;
        }

        .click-instruction {
            font-size: 1.3rem;
            color: #DC143C;
            animation: clickPulse 1.5s ease infinite;
        }

        @keyframes clickPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 15px 40px rgba(255, 215, 0, 0.8); }
        }

        @keyframes authorsAppear {
            from {
                opacity: 0;
            }

// Variables globals
let currentSlide = 0;
let isWelcomeScreen = true;
let mechanicHud;
let multiplayerHud;

// Inicialització
document.addEventListener('DOMContentLoaded', () => {
    setupInteractiveBackground();
    setupMechanicHud();
    setupMultiplayerHud();
    showWelcomeScreen();
    setupEventListeners();
});

// Pantalla de benvinguda
function showWelcomeScreen() {
    const container = document.querySelector('.presentation-container');
    container.innerHTML = `
        <div class="welcome-screen">
            <h1 class="welcome-title">El Transport de Substàncies al Cos Humà</h1>
            <p class="welcome-subtitle">Presentació Educativa Completa - 38 Diapositives</p>
            <div class="authors">
                Aissa Rousi • Ivan Rios • Roger Omegna<br>
                Unai Jimenez • Yeremi Suarez<br>
                <span style="font-size: 1rem; color: #999; margin-top: 10px; display: block;">3r ESO</span>
            </div>
            <p class="click-instruction">Fes clic per començar</p>
        </div>
    `;
}

// Inicia la presentació
function startPresentation() {
    isWelcomeScreen = false;
    currentSlide = 0;

    const container = document.querySelector('.presentation-container');
    container.innerHTML = '';

    // Crear totes les diapositives
    slidesData.forEach((slideData, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.id = 'slide-' + index;
        slide.innerHTML = slideData.content;
        container.appendChild(slide);
    });

    // Afegir indicador
    const indicator = document.createElement('div');
    indicator.className = 'slide-indicator';
    indicator.id = 'slide-indicator';
    container.appendChild(indicator);

    // Mostrar primera diapositiva
    showSlide(0);
}

// Array de transicions variades
const transitions = [
    'transition-fade',
    'transition-slide-left',
    'transition-slide-right',
    'transition-slide-up',
    'transition-zoom',
    'transition-rotate',
    'transition-flip',
    'transition-expand',
    'transition-blur',
    'transition-bounce'
];

const mechanicModes = [
    { className: 'mechanic-tilt mechanic-parallax', title: 'Parallax dinàmic', tip: 'Mou el ratolí o toca la pantalla per veure com el fons es desplaça.' },
    { className: 'mechanic-aurora', title: 'Aurora viva', tip: 'Observa com el fons es contorsiona mentre expliques el concepte.' },
    { className: 'mechanic-spotlight', title: 'Focus interactiu', tip: 'Mou el cursor per remarcar parts del contingut amb el focus lluminós.' },
    { className: 'mechanic-pulse', title: 'Intensitat de dades', tip: 'Els quadres destacats bateguen per subratllar els missatges clau.' }
];

const mechanicClasses = mechanicModes.flatMap(mode => mode.className.split(' '));

// Mostra una diapositiva amb transició variada (sense pantalla negra)
function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    const indicator = document.getElementById('slide-indicator');

    // Trobar la diapositiva anterior activa
    const previousSlide = document.querySelector('.slide.active');

    // Eliminar totes les transicions de totes les diapositives
    slides.forEach(slide => {
        transitions.forEach(t => slide.classList.remove(t));
    });

    // Aplicar la transició a la nova diapositiva ABANS de fer-la visible
    const transitionClass = transitions[index % transitions.length];
    slides[index].classList.add(transitionClass);

    // Fer visible la nova diapositiva immediatament (sense timeout!)
    slides[index].classList.add('active');

    applySlideMechanic(slides[index], index);

    // Després d'un moment curt, amagar l'anterior
    if (previousSlide && previousSlide !== slides[index]) {
        setTimeout(() => {
            previousSlide.classList.remove('active');
            previousSlide.classList.remove('exit');
        }, 50);
    }

    // Actualitzar indicador
    if (indicator) {
        indicator.textContent = (index + 1) + ' / ' + slidesData.length;
    }
}

function applySlideMechanic(slide, index) {
    if (!slide) return;

    slide.classList.remove(...mechanicClasses);
    const mode = mechanicModes[index % mechanicModes.length];
    mode.className.split(' ').forEach(cls => slide.classList.add(cls));
    updateMechanicHud(mode, index);
}

// Següent diapositiva
function nextSlide() {
    if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        showSlide(currentSlide);
    } else {
        // Tornar al principi
        restartPresentation();
    }
}

// Diapositiva anterior
function previousSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        showSlide(currentSlide);
    }
}

function setupInteractiveBackground() {
    document.addEventListener('pointermove', (event) => {
        const x = (event.clientX / window.innerWidth - 0.5) * 2;
        const y = (event.clientY / window.innerHeight - 0.5) * 2;
        document.documentElement.style.setProperty('--parallax-x', x.toFixed(3));
        document.documentElement.style.setProperty('--parallax-y', y.toFixed(3));

        const overlay = document.getElementById('interactive-overlay');
        if (overlay) {
            overlay.style.transform = `translate3d(${x * 8}px, ${y * 6}px, 0)`;
        }
    });
}

function setupMechanicHud() {
    mechanicHud = document.createElement('div');
    mechanicHud.className = 'mechanic-hud';
    mechanicHud.innerHTML = `
        <h4>🎛️ Mecànica interactiva</h4>
        <p>Les diapositives ara responen al moviment i tenen efectes vius.</p>
    `;
    document.body.appendChild(mechanicHud);
}

function updateMechanicHud(mode, index) {
    if (!mechanicHud) return;
    mechanicHud.innerHTML = `
        <h4>🎛️ Mecànica ${index + 1}</h4>
        <p><strong>${mode.title}</strong>: ${mode.tip}</p>
    `;
}

function setupMultiplayerHud() {
    if (multiplayerHud) return;
    const playerLink = new URL('quiz-multiplayer/player.html', window.location.href).href;

    multiplayerHud = document.createElement('div');
    multiplayerHud.className = 'multiplayer-hud';
    multiplayerHud.innerHTML = `
        <h4>🎮 Mode multijugador millorat</h4>
        <p style="color: #f2f2f2; font-size: 0.95rem; margin-bottom: 10px;">Obre el host o envia l'enllaç als mòbils per sumar participants a l'instant.</p>
        <div class="multiplayer-actions">
            <button id="open-host">Obrir Host</button>
            <a id="open-player" href="quiz-multiplayer/player.html" target="_blank" rel="noopener">Obrir Player</a>
            <button id="copy-link">Copiar enllaç</button>
        </div>
        <p style="margin-top: 8px; font-size: 0.85rem; color: #cfcfcf; word-break: break-all;">${playerLink}</p>
    `;

    document.body.appendChild(multiplayerHud);

    multiplayerHud.querySelector('#open-host')?.addEventListener('click', (e) => {
        e.stopPropagation();
        startPresentation();
        startMultiplayerQuiz();
    });

    multiplayerHud.querySelector('#open-player')?.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    multiplayerHud.querySelector('#copy-link')?.addEventListener('click', (e) => {
        e.stopPropagation();
        copyLinkToClipboard(playerLink);
    });
}

function copyLinkToClipboard(link) {
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(link).then(() => {
            if (multiplayerHud) {
                const linkLabel = multiplayerHud.querySelector('p:last-of-type');
                const previousText = linkLabel.textContent;
                linkLabel.textContent = 'Enllaç copiat! ' + link;
                setTimeout(() => {
                    linkLabel.textContent = previousText;
                    updateMechanicHud(mechanicModes[currentSlide % mechanicModes.length], currentSlide);
                }, 1200);
            }
        });
    }
}

// Event listeners
function setupEventListeners() {
    // Click per avançar
    document.addEventListener('click', () => {
        if (isWelcomeScreen) {
            startPresentation();
        } else {
            nextSlide();
        }
    });

    // Navegació amb teclat
    document.addEventListener('keydown', (e) => {
        if (isWelcomeScreen) {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                startPresentation();
            }
            return;
        }

        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            previousSlide();
        } else if (e.key === 'Home') {
            e.preventDefault();
            currentSlide = 0;
            showSlide(0);
        } else if (e.key === 'End') {
            e.preventDefault();
            currentSlide = slidesData.length - 1;
            showSlide(currentSlide);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            restartPresentation();
        }
    });
}

// Reiniciar presentació
function restartPresentation() {
    isWelcomeScreen = true;
    currentSlide = 0;
    document.querySelectorAll('.slide').forEach(el => el.remove());
    const indicator = document.getElementById('slide-indicator');
    if (indicator) indicator.remove();
    showWelcomeScreen();
}

// Iniciar Quiz Multiplayer
function startMultiplayerQuiz() {
    const quizWindow = window.open('quiz-multiplayer/host.html', '_blank', 'width=1200,height=800');
    if (!quizWindow) {
        alert('Si us plau, permet les finestres emergents per iniciar el quiz multiplayer.');
    }
}
