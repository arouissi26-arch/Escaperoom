<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Transport de Substàncies al Cos Humà</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background: #0a0a0a;
            height: 100vh;
            cursor: pointer;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            opacity: 0;
        }

        .slide.active {
            display: block;
            animation: slideEnter 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes slideEnter {
            from {
                opacity: 0;
                transform: scale(0.8) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        .slide.exit {
            animation: slideExit 0.6s ease forwards;
        }

        @keyframes slideExit {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.8) translateX(-200px);
            }
        }

        .slide-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Gradients variats */
        .bg-red-blue {
            background: linear-gradient(135deg, #8B0000 0%, #1e1e3f 100%);
        }

        .bg-blue-red {
            background: linear-gradient(135deg, #1e1e3f 0%, #8B0000 100%);
        }

        .bg-green-dark {
            background: linear-gradient(135deg, #0a4d2e 0%, #0a0a0a 100%);
        }

        .bg-purple-dark {
            background: linear-gradient(135deg, #4a0080 0%, #1a0033 100%);
        }

        .bg-orange-dark {
            background: linear-gradient(135deg, #cc4400 0%, #0a0a0a 100%);
        }

        .bg-cyan-dark {
            background: linear-gradient(135deg, #006b7d 0%, #0a0a0a 100%);
        }

        .bg-yellow-dark {
            background: linear-gradient(135deg, #b8860b 0%, #0a0a0a 100%);
        }

        .bg-teal-dark {
            background: linear-gradient(135deg, #00695c 0%, #0a0a0a 100%);
        }

        .bg-magenta-dark {
            background: linear-gradient(135deg, #880e4f 0%, #0a0a0a 100%);
        }

        .bg-indigo-dark {
            background: linear-gradient(135deg, #1a237e 0%, #0a0a0a 100%);
        }

        .bg-split-rg {
            background: linear-gradient(90deg, #8B0000 0%, #8B0000 50%, #0a4d2e 50%, #0a4d2e 100%);
        }

        .bg-split-bp {
            background: linear-gradient(90deg, #1e1e3f 0%, #1e1e3f 50%, #4a0080 50%, #4a0080 100%);
        }

        .slide-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .slide-title {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: titleReveal 1s ease forwards;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slide-subtitle {
            font-size: 1.8rem;
            font-weight: 300;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 40px;
            animation: subtitleReveal 1s ease 0.3s forwards;
            opacity: 0;
        }

        @keyframes subtitleReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .elegant-list {
            list-style: none;
            padding: 0;
            max-width: 1100px;
            margin: 0 auto;
        }

        .elegant-list li {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            padding-left: 50px;
            position: relative;
            opacity: 0;
            animation: listItemAppear 0.6s ease forwards;
        }

        .elegant-list li:nth-child(1) { animation-delay: 0.4s; }
        .elegant-list li:nth-child(2) { animation-delay: 0.6s; }
        .elegant-list li:nth-child(3) { animation-delay: 0.8s; }
        .elegant-list li:nth-child(4) { animation-delay: 1s; }
        .elegant-list li:nth-child(5) { animation-delay: 1.2s; }
        .elegant-list li:nth-child(6) { animation-delay: 1.4s; }

        @keyframes listItemAppear {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .elegant-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 4px;
            background: linear-gradient(90deg, #DC143C 0%, #1e3a8a 100%);
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            width: 100%;
            max-width: 1400px;
        }

        .column {
            animation: columnSlide 0.8s ease forwards;
            opacity: 0;
        }

        .column:nth-child(1) {
            animation-delay: 0.4s;
        }

        .column:nth-child(2) {
            animation-delay: 0.6s;
        }

        @keyframes columnSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .column h3 {
            font-size: 2rem;
            color: #DC143C;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .column p {
            font-size: 1.2rem;
            color: #d0d0d0;
            line-height: 1.7;
        }

        .highlight-box {
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.2) 0%, rgba(30, 58, 138, 0.2) 100%);
            border: 2px solid #DC143C;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            animation: boxGlow 2s ease infinite;
        }

        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
            50% { box-shadow: 0 0 40px rgba(220, 20, 60, 0.6); }
        }

        .highlight-box h4 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .highlight-box p {
            font-size: 1.2rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .slide-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(220, 20, 60, 0.4);
            animation: imageZoomIn 1.2s ease-out;
            object-fit: contain;
        }

        .slide-image.centered {
            display: block;
            margin: 30px auto;
            max-height: 600px;
        }

        @keyframes imageZoomIn {
            from {
                opacity: 0;
                transform: scale(0.85) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .two-columns.image-text {
            align-items: center;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            animation: dataItemFade 0.8s ease forwards;
            opacity: 0;
        }

        .data-item:nth-child(1) { animation-delay: 0.5s; }
        .data-item:nth-child(2) { animation-delay: 0.7s; }
        .data-item:nth-child(3) { animation-delay: 0.9s; }
        .data-item:nth-child(4) { animation-delay: 1.1s; }
        .data-item:nth-child(5) { animation-delay: 1.3s; }
        .data-item:nth-child(6) { animation-delay: 1.5s; }

        @keyframes dataItemFade {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .data-item:hover {
            border-color: #DC143C;
            background: rgba(220, 20, 60, 0.1);
            transform: translateY(-10px);
        }

        .data-item h5 {
            font-size: 2.5rem;
            color: #DC143C;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .data-item p {
            font-size: 1.1rem;
            color: #d0d0d0;
        }

        .welcome-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B0000 0%, #0a0a0a 50%, #1e3a8a 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .welcome-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            animation: welcomeTitle 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-transform: uppercase;
            letter-spacing: 6px;
        }

        @keyframes welcomeTitle {
            from {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .welcome-subtitle {
            font-size: 1.6rem;
            color: #e0e0e0;
            margin-bottom: 50px;
            animation: welcomeSubtitle 1s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes welcomeSubtitle {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .authors {
            font-size: 1.2rem;
            color: #d0d0d0;
            margin-bottom: 60px;
            animation: authorsAppear 1s ease 1s forwards;
            opacity: 0;
            text-align: center;
        }

        .click-instruction {
            font-size: 1.3rem;
            color: #DC143C;
            animation: clickPulse 1.5s ease infinite;
        }

        @keyframes clickPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 15px 40px rgba(255, 215, 0, 0.8); }
        }

        @keyframes authorsAppear {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            z-index: 1000;
        }

        .big-number {
            font-size: 10rem;
            font-weight: 900;
            color: rgba(220, 20, 60, 0.2);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: numberRotate 20s linear infinite;
        }

        @keyframes numberRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .big-text {
            font-size: 4rem;
            font-weight: 900;
            color: #DC143C;
            text-align: center;
            line-height: 1.2;
            animation: bigTextPulse 2s ease infinite;
        }

        @keyframes bigTextPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 1200px) {
            .slide-title { font-size: 3rem; }
            .elegant-list li { font-size: 1.3rem; }
            .two-columns { grid-template-columns: 1fr; gap: 30px; }
            .data-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .slide-content { padding: 30px; }
            .slide-title { font-size: 2rem; letter-spacing: 2px; }
            .elegant-list li { font-size: 1.1rem; }
            .data-grid { grid-template-columns: 1fr; }
        }

        /* Panell de control interactiu */
        .control-shell {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1200;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.3s ease, right 0.3s ease;
        }

        .control-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px 0 0 12px;
            width: 44px;
            height: 52px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
        }

        .control-shell.collapsed .control-toggle {
            border-radius: 12px;
        }

        .control-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 380px;
            max-width: 90vw;
            padding: 16px 18px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            color: #e5e5e5;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .control-panel.light-ui {
            background: rgba(255, 255, 255, 0.8);
            color: #1a1a1a;
            border-color: rgba(0, 0, 0, 0.06);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #c9c9c9;
        }

        .control-panel.light-ui .control-title {
            color: #444;
        }

        .control-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(118, 75, 162, 0.55);
        }

        .control-button.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e5e5e5;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .control-panel.light-ui .control-button.secondary {
            background: rgba(0, 0, 0, 0.04);
            color: #111;
            border-color: rgba(0, 0, 0, 0.08);
        }

        .control-button.secondary:hover {
            transform: translateY(-2px);
            border-color: #a78bfa;
        }

        .progress-shell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 240px;
        }

        .progress-track {
            width: 180px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(135deg, #DC143C 0%, #1e3a8a 100%);
            transition: width 0.3s ease;
        }

        .control-panel.light-ui .progress-track {
            background: rgba(0, 0, 0, 0.05);
        }

        .control-panel input[type="range"] {
            accent-color: #DC143C;
            cursor: pointer;
        }

        .chip {
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .control-panel.light-ui .chip {
            border-color: rgba(0, 0, 0, 0.08);
            background: rgba(0, 0, 0, 0.04);
            color: #111;
        }

        .control-select {
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .control-panel.light-ui .control-select {
            background: rgba(255, 255, 255, 0.85);
            color: #111;
            border-color: rgba(0, 0, 0, 0.08);
        }

        .control-shell.collapsed .control-panel {
            opacity: 0;
            transform: translateX(20px) scale(0.98);
            pointer-events: none;
        }

        .control-shell.collapsed {
            right: -6px;
        }

        @media (max-width: 1100px) {
            .control-shell {
                top: auto;
                bottom: 16px;
                right: 12px;
                transform: none;
            }
            .control-panel {
                width: calc(100vw - 90px);
            }
        }

    </style>
</head>
<body>
    <div class="presentation-container"></div>
    <div class="control-shell" id="control-shell">
        <button class="control-toggle" id="control-toggle" aria-expanded="true" aria-label="Amaga el panell">⮜</button>
        <div class="control-panel" id="control-panel">
            <div class="control-group">
                <button class="control-button secondary" id="prev-btn">⟵ Anterior</button>
                <button class="control-button" id="next-btn">Següent ⟶</button>
                <button class="control-button secondary" id="theme-toggle">Mode nit</button>
            </div>
            <div class="control-group">
                <div class="progress-shell">
                    <span class="control-title">Progrés</span>
                    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                    <span class="chip" id="progress-text">0 / 0</span>
                </div>
                <select id="jump-select" class="control-select"></select>
            </div>
            <div class="control-group">
                <div>
                    <div class="control-title">Auto-play (s)</div>
                    <input type="range" id="auto-speed" min="3" max="12" step="1" value="8">
                </div>
                <span class="chip" id="auto-label">Pausa</span>
                <button class="control-button" id="auto-toggle">▶︎ Auto</button>
                <button class="control-button secondary" id="quiz-btn">Quiz</button>
            </div>
        </div>
    </div>

    <script>
const slidesData = [    // Diapositiva 1: Portada
    {
        content: `
            <div class="slide-bg bg-red-blue"></div>
            <div class="slide-content">
                <h1 class="slide-title">El Transport de Substàncies</h1>
                <p class="slide-subtitle">Al Cos Humà</p>
                <div class="highlight-box" style="max-width: 700px;">
                    <p style="font-size: 1.4rem; color: #ffffff;">Una exploració completa del sistema circulatori, limfàtic i transport cel·lular</p>

                <div style="margin-top: 40px; font-size: 1.3rem; color: #d0d0d0;">
                    <p>Aissa Rousi • Ivan Rios • Roger Omegna</p>
                    <p style="margin-top: 10px;">Unai Jimenez • Yeremi Suarez</p>
                    <p style="margin-top: 20px; font-size: 1.1rem; color: #999;">3r ESO</p>
                </div>
            </div>
        `

    // Diapositiva 2: Per què és important el transport?
    {
        content: `
            <div class="slide-bg bg-green-dark"></div>

                <h1 class="slide-title">Per què és important el transport?</h1>
                <p class="slide-subtitle">El cos humà com una ciutat ben organitzada</p>
                <div class="two-columns">
                    <div class="column">
                        <h3>Una ciutat necessita:</h3>

                        <p style="margin-top: 15px;">Retirar productes de rebuig</p>
                    </div>
                </div>
                <div class="highlight-box" style="margin-top: 40px;">
                    <h4>Sense aquest transport constant...</h4>
                    <p>Les cèl·lules no podrien sobreviure! Avui explorarem els mecanismes fascinants que fan possible aquest transport vital.</p>
                </div>
            </div>
        `
    },

    // Diapositiva 3: Transport a nivell cel·lular
    {
        content: `
            <div class="slide-bg bg-cyan-dark"></div>
            <div class="slide-content">
                <h1 class="slide-title">Transport a Nivell Cel·lular</h1>
                <p class="slide-subtitle">La membrana plasmàtica: la porta d'entrada</p>
                <div class="two-columns image-text">
                    <div class="column">
                        <img src="imagen-membrana-celular.jpg" alt="Membrana cel·lular" class="slide-image">

                    <div class="column">
                        <p style="font-size: 1.4rem; line-height: 1.8;">Totes les cèl·lules estan envoltades per una <strong>membrana plasmàtica</strong> que actua com una porta selectiva.</p>

                        <p style="margin-top: 25px; font-size: 1.4rem; line-height: 1.8; color: #FFD700;">És essencial per mantenir l'equilibri intern!</p>
                    </div>
                </div>
            </div>
        `
    },

    // Diapositiva 4: Transport passiu
    {
        content: `
            <div class="slide-bg bg-teal-dark"></div>
            <div class="slide-content">
                <h1 class="slide-title">Transport Passiu</h1>

                <p style="margin-top: 30px; font-size: 1.1rem; color: #FFD700; animation: clickPulse 1.5s ease infinite;">Clic per tornar al principi</p>
            </div>
        `
    }
];

// Variables globals
let currentSlide = 0;
let isWelcomeScreen = true;
let autoTimer = null;
let autoDelay = 8000;
let isAutoPlaying = false;

// Inicialització
document.addEventListener('DOMContentLoaded', () => {
    showWelcomeScreen();
    setupEventListeners();
    setupControlPanel();
    populateJumpSelect();
});

// Pantalla de benvinguda
function showWelcomeScreen() {
    const container = document.querySelector('.presentation-container');
    container.innerHTML = `
        <div class="welcome-screen">
            <h1 class="welcome-title">El Transport de Substàncies al Cos Humà</h1>
            <p class="welcome-subtitle">Presentació Educativa Completa - 38 Diapositives</p>
            <div class="authors">
                Aissa Rousi • Ivan Rios • Roger Omegna<br>
                Unai Jimenez • Yeremi Suarez<br>
                <span style="font-size: 1rem; color: #999; margin-top: 10px; display: block;">3r ESO</span>
            </div>
            <p class="click-instruction">Fes clic per començar</p>
        </div>
    `;
}

// Inicia la presentació
function startPresentation() {
    isWelcomeScreen = false;
    currentSlide = 0;
    stopAutoAdvance();

    const container = document.querySelector('.presentation-container');
    container.innerHTML = '';

    // Crear totes les diapositives
    slidesData.forEach((slideData, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.id = 'slide-' + index;
        slide.innerHTML = slideData.content;
        container.appendChild(slide);
    });

    // Afegir indicador
    const indicator = document.createElement('div');
    indicator.className = 'slide-indicator';
    indicator.id = 'slide-indicator';
    container.appendChild(indicator);

    // Mostrar primera diapositiva
    showSlide(0);
}

// Mostra una diapositiva
function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    const indicator = document.getElementById('slide-indicator');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const jumpSelect = document.getElementById('jump-select');

    slides.forEach(slide => {
        slide.classList.remove('active');
        slide.classList.remove('exit');
    });

    setTimeout(() => {
        slides[index].classList.add('active');
        if (indicator) {
            indicator.textContent = (index + 1) + ' / ' + slidesData.length;
        }
        if (progressFill) {
            const progress = ((index + 1) / slidesData.length) * 100;
            progressFill.style.width = progress + '%';
        }
        if (progressText) {
            progressText.textContent = (index + 1) + ' / ' + slidesData.length;
        }
        if (jumpSelect) {
            jumpSelect.value = String(index);
        }
    }, 100);
}

// Següent diapositiva
function nextSlide() {
    if (currentSlide < slidesData.length - 1) {
        const currentSlideEl = document.getElementById('slide-' + currentSlide);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            currentSlide++;
            showSlide(currentSlide);
        }, 600);
    } else {
        // Tornar al principi
        const currentSlideEl = document.getElementById('slide-' + currentSlide);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            restartPresentation();
        }, 600);
    }
}

// Diapositiva anterior
function previousSlide() {
    if (currentSlide > 0) {
        const currentSlideEl = document.getElementById('slide-' + currentSlide);
        currentSlideEl.classList.add('exit');

        setTimeout(() => {
            currentSlide--;
            showSlide(currentSlide);
        }, 600);
    }
}

// Event listeners
function setupEventListeners() {
    // Click per avançar
    document.addEventListener('click', (event) => {
        if (event.target.closest('.control-shell')) return;
        if (isWelcomeScreen) {
            startPresentation();
        } else {
            nextSlide();
        }
    });

    // Navegació amb teclat
    document.addEventListener('keydown', (e) => {
        if (isWelcomeScreen) {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                startPresentation();
            }
            return;
        }

        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            previousSlide();
        } else if (e.key === 'Home') {
            e.preventDefault();
            currentSlide = 0;
            showSlide(0);
        } else if (e.key === 'End') {
            e.preventDefault();
            currentSlide = slidesData.length - 1;
            showSlide(currentSlide);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            restartPresentation();
        }
    });
}

// Reiniciar presentació
function restartPresentation() {
    isWelcomeScreen = true;
    currentSlide = 0;
    stopAutoAdvance();
    document.querySelectorAll('.slide').forEach(el => el.remove());
    const indicator = document.getElementById('slide-indicator');
    if (indicator) indicator.remove();
    showWelcomeScreen();
}

// Iniciar Quiz Multiplayer
function startMultiplayerQuiz() {
    const quizWindow = window.open('quiz-multiplayer/host.html', '_blank', 'width=1200,height=800');
    if (!quizWindow) {
        alert('Si us plau, permet les finestres emergents per iniciar el quiz multiplayer.');
    }
}

// Panell de control
function setupControlPanel() {
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const autoToggle = document.getElementById('auto-toggle');
    const autoSpeed = document.getElementById('auto-speed');
    const themeToggle = document.getElementById('theme-toggle');
    const jumpSelect = document.getElementById('jump-select');
    const quizBtn = document.getElementById('quiz-btn');
    const controlToggle = document.getElementById('control-toggle');

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); previousSlide(); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
    autoToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleAutoAdvance(); });
    themeToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleTheme(); });
    autoSpeed.addEventListener('input', (e) => { e.stopPropagation(); updateAutoSpeed(e.target.value); });
    jumpSelect.addEventListener('change', (e) => { e.stopPropagation(); goToSlide(parseInt(e.target.value, 10)); });
    quizBtn.addEventListener('click', (e) => { e.stopPropagation(); startMultiplayerQuiz(); });
    controlToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleControlShell(); });

    updateAutoLabel();
}

function populateJumpSelect() {
    const jumpSelect = document.getElementById('jump-select');
    jumpSelect.innerHTML = '';
    slidesData.forEach((_, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `Diapositiva ${index + 1}`;
        jumpSelect.appendChild(option);
    });
}

function goToSlide(index) {
    if (index >= 0 && index < slidesData.length) {
        currentSlide = index;
        showSlide(currentSlide);
    }
}

function toggleAutoAdvance() {
    if (isAutoPlaying) {
        stopAutoAdvance();
    } else {
        startAutoAdvance();
    }
}

function startAutoAdvance() {
    stopAutoAdvance();
    isAutoPlaying = true;
    autoTimer = setInterval(() => {
        if (!isWelcomeScreen) {
            nextSlide();
        }
    }, autoDelay);
    updateAutoLabel();
}

function stopAutoAdvance() {
    isAutoPlaying = false;
    if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
    }
    updateAutoLabel();
}

function updateAutoSpeed(value) {
    autoDelay = Number(value) * 1000;
    if (isAutoPlaying) {
        startAutoAdvance();
    }
    updateAutoLabel();
}

function updateAutoLabel() {
    const autoLabel = document.getElementById('auto-label');
    const autoToggle = document.getElementById('auto-toggle');
    const seconds = autoDelay / 1000;
    autoLabel.textContent = isAutoPlaying ? `Cada ${seconds}s` : 'Pausa';
    autoToggle.textContent = isAutoPlaying ? '⏸ Pausa' : '▶︎ Auto';
}

function toggleControlShell() {
    const shell = document.getElementById('control-shell');
    const toggle = document.getElementById('control-toggle');
    const isCollapsed = shell.classList.toggle('collapsed');
    toggle.textContent = isCollapsed ? '⮞' : '⮜';
    toggle.setAttribute('aria-expanded', (!isCollapsed).toString());
    toggle.setAttribute('aria-label', isCollapsed ? 'Mostra el panell' : 'Amaga el panell');
}

function toggleTheme() {
    const panel = document.getElementById('control-panel');
    const isLight = panel.classList.toggle('light-ui');
    document.body.classList.toggle('light-mode', isLight);
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.textContent = isLight ? 'Mode dia' : 'Mode nit';
}
    </script>
</body>
